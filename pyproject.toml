[project]
name = "enchilada"
version = "0.4.0"
description = "Blocked-Gibbs global-fit orchestration for LISA: the Wheel/Block/L1Data protocol"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Aaron Johnson", email = "aaron9035@gmail.com" },
]
# Floor set by domania>=3.0 and lisaorbits>=3.0.3; both need >=3.12.
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
keywords = [
    "LISA",
    "gravitational-waves",
    "global-fit",
    "gibbs-sampling",
    "tdi",
    "astronomy",
]
dependencies = [
    # domania (the WDM transform) needs numpy>=2.1 and scipy>=1.14.1; scipy is
    # also imported directly by resample.py and orbits.py. The core-minimum CI
    # lane pins these floors and h5py's below. domania is capped below 4 because
    # enchilada's WDM arrays are domania 3's folded layout.
    "numpy>=2.1",
    "scipy>=1.14.1",
    "domania>=3.0,<4",
    # The Wheel writes its campaign output file with h5py. 3.12.1 is lisaorbits'
    # own floor and the first non-yanked release with wheels for 3.12 and 3.13;
    # Python 3.14 wheels begin at 3.15.0; the lock resolves a newer release.
    "h5py>=3.12.1",
]

[project.urls]
Homepage = "https://github.com/AaronDJohnson/enchilada"
Repository = "https://github.com/AaronDJohnson/enchilada"
Changelog = "https://github.com/AaronDJohnson/enchilada/blob/main/CHANGELOG.md"
Issues = "https://github.com/AaronDJohnson/enchilada/issues"

[project.optional-dependencies]
numeric-orbits = [
    "h5py>=3.12.1",       # lisaorbits' own floor
    "lisaorbits>=3.0.3",  # sets the >=3.12 python floor with domania
]
mojito = [
    "h5py>=3.12.1",       # kept so enchilada[mojito] still resolves; h5py is core since 0.4.0
]
examples = [
    "jupyterlab>=4",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[build-system]
# Keep the declared backend aligned with UV_VERSION in the CI/release workflows.
requires = ["uv_build==0.12.1"]
build-backend = "uv_build"

[tool.uv.build-backend]
# uv_build's default sdist carries only src/ + README + LICENSE + pyproject.
# Downstream packagers (conda-forge, Debian, Spack, HPC sites) build from the
# sdist and should be able to run the suite as a build-time check.
# Recursive globs: a future tests/data/ or tests/unit/ must not be dropped
# silently. CI's sdist leg unpacks the archive and runs the suite from it, so
# an omission here fails the build rather than reaching a packager.
source-include = [
    "tests/**/*.py",
    "examples/**/*.py",
    "examples/**/*.ipynb",
    "examples/**/*.txt",
    "forge/**/*.py",
    "forge/**/*.ipynb",
    "forge/**/*.md",
    "docs/**/*.svg",
    "benchmarks/**/*.py",
    ".github/workflows/*.yml",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/enchilada"]
python_version = "3.12"
# enchilada ships py.typed, so consumers' checkers trust these annotations.
# Without this, an unannotated function body is not checked at all.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# scipy and h5py ship no type information; their use here is narrow.
module = ["scipy.*", "h5py.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/enchilada"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
line-length = 88
src = ["src", "tests", "examples", "benchmarks", "forge"]

[tool.ruff.lint]
select = ["E4", "E5", "E7", "E9", "F", "I", "B", "UP"]  # E5 = line length

[tool.ruff.lint.per-file-ignores]
# Notebooks group imports per cell rather than in one sorted block (I001) and
# print long formatted lines (E501). Both were verified to fire; do not broaden
# this list without checking, so real problems in notebook cells still surface.
"examples/*.ipynb" = ["I001", "E501"]
