name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.1"

jobs:
  # Full gate: lint, format, types, tests behind the coverage gate, build, and a
  # smoke test of the artifact that actually gets published.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Install (locked, with extras and dev group)
        # --locked fails fast if uv.lock has drifted from pyproject.toml, so CI
        # never passes against a resolution contributors do not get locally
        run: uv sync --locked --extra numeric-orbits --extra mojito
      - name: Notebook tests need matplotlib (it arrives with lisaorbits)
        run: uv run --no-sync python -c "import matplotlib"
      - name: Lint
        run: uv run --no-sync ruff check src tests examples benchmarks forge
      - name: Format
        run: uv run --no-sync ruff format --check src tests examples benchmarks forge
      - name: Type-check
        # enchilada ships py.typed, so its annotations are load-bearing for
        # consumers' type checkers -- validate them here
        run: uv run --no-sync mypy
      - name: Test (with coverage gate)
        run: uv run --no-sync pytest -q --cov --cov-report=term-missing
      - name: Build artifacts
        run: uv build --force-pep517
      - name: Smoke-test the built wheel
        # proves the artifact is importable and actually carries py.typed --
        # `uv build` alone only proves the build did not crash
        run: |
          uv run --no-project --isolated --with dist/*.whl python -c "
          import importlib.resources as r, enchilada
          print('version:', enchilada.__version__)
          assert r.files('enchilada').joinpath('py.typed').is_file(), 'py.typed missing'
          print('py.typed present in installed wheel')
          "

  # The core is numpy, scipy, domania and h5py. Prove it imports and tests on
  # every supported interpreter, including 3.14 (which the LISA dev stack runs);
  # the lisaorbits-loader and notebook tests skip without lisaorbits and
  # matplotlib.
  core-only:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Install core only (no extras)
        run: uv sync --no-extra numeric-orbits
      - name: Test (no coverage gate -- lisaorbits and notebook tests skip)
        run: uv run --no-sync pytest -q

  # Install the core at its declared floors without the extras: uv sync would
  # resolve them too and let lisaorbits raise the floors.
  core-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Install the core at its dependency floors
        run: |
          uv venv --python 3.12
          uv pip install --only-binary numpy --only-binary scipy --group dev -e . "numpy==2.1.0" "scipy==1.14.1" "domania==3.0.0" "h5py==3.12.1"
      - name: Verify the tested dependency boundary
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.util

          import domania
          import h5py
          import numpy
          import scipy

          assert numpy.__version__ == "2.1.0", numpy.__version__
          assert scipy.__version__ == "1.14.1", scipy.__version__
          assert domania.__version__ == "3.0.0", domania.__version__
          assert h5py.__version__ == "3.12.1", h5py.__version__
          assert importlib.util.find_spec("lisaorbits") is None, "lisaorbits"
          print("core minimum: NumPy", numpy.__version__, "SciPy", scipy.__version__,
                "domania", domania.__version__, "h5py", h5py.__version__)
          PY
      - name: Test the core minimum
        run: uv run --no-sync pytest -q

  # Keep the extras' minimum resolution separate from the core floor.
  floors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Resolve to the declared lower bounds
        run: uv sync --resolution lowest-direct --extra numeric-orbits --extra mojito
      - name: Test the resolved minimum versions
        # A plain uv run would re-resolve using the default highest strategy.
        run: uv run --no-sync pytest -q

  # The sdist claims to be self-testing (source-include ships tests/ and
  # examples/). Downstream packagers build from it, so prove the claim: unpack
  # the archive and run the suite from *that tree only*, never the checkout.
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Build the sdist
        run: uv build --force-pep517 --sdist
      - name: Unpack somewhere the checkout cannot be picked up
        run: |
          mkdir -p "$RUNNER_TEMP/from-sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/from-sdist" --strip-components=1
          ls "$RUNNER_TEMP/from-sdist"
      - name: Run the packaged suite against the packaged source
        working-directory: ${{ runner.temp }}/from-sdist
        run: |
          uv sync --extra numeric-orbits --extra mojito
          uv run --no-sync pytest -q
